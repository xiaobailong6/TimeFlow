name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Robolectric 跑 SDK 36（Android 16 / Baklava）需要 Java 21。
      #
      # 依据 Robolectric 4.16.1 的 DefaultSdkProvider.populateSdks：
      #   Baklava.SDK_INT -> requiredJavaVersion = 21
      # 而 Sdk.isSupported() 的判据是 requiredJavaVersion <= 运行时 Java 版本，
      # 不满足时 verifySupportedSdk 直接抛 UnsupportedOperationException。
      # 之前用 JDK 17，三个测试类都在 classMethod 阶段挂掉。
      # API 37（CinnamonBun）同样要求 21，所以升到 21 也向后兼容。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete `tools` package, which no
          # longer exists in the current Android SDK repository.
          packages: platform-tools

      # compileSdk 需要 37（Compose 1.12.1 / Haze 2.0.1 的 AAR metadata 要求）。
      # 注意平台目录名是 `android-37.0` 而不是 `android-37`：
      # API 37 起 Google 改用了「主版本.小版本」的命名，仓库里根本没有
      # 不带小版本号的 android-37，所以这里必须装 37.0，
      # 并与 build.gradle.kts 里的 `compileSdk = 37` + `compileSdkMinor = 0` 对应。
      # 同时保留 36.0.0 的 build-tools，避免 AGP 默认版本与本机已装版本不一致。
      - name: Install Android SDK platforms and build tools
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 还原固定签名文件。
      #
      # 仓库里不放 .jks（那是私钥，一旦提交就等于泄露）。CI 从 Secret 读取
      # base64 文本，解码成文件后再交给 Gradle。
      # 没配置 Secret 时不报错，退回 AGP 默认 debug 签名——fork 与本机构建不受影响。
      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "已还原签名文件：$(stat -c%s "$GITHUB_WORKSPACE/release.jks") 字节"
          else
            echo "::notice::未配置 KEYSTORE_BASE64，本次使用 AGP 默认 debug 签名"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 签名相关的四个环境变量同时传给测试与打包步骤：
      # build.gradle.kts 里的 releaseSigningEnabled 会检查
      # KEYSTORE_PATH 指向的文件确实存在，才启用固定签名。
      #
      # 这里刻意不用 YAML 锚点（&/*）：GitHub Actions 对锚点的支持不稳定，
      # 直接把 env 块写两遍更可靠。
      - name: Run unit tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # 把签名指纹打到日志里，方便确认「这次产物的签名是不是预期的那个」。
      # 换签名会导致覆盖安装失败，有了这行就不用靠猜。
      - name: Print APK signing certificate
        shell: bash
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" \
            | grep -E "Signer #1 certificate (DN|SHA-256)" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeordered-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeordered-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
